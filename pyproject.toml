[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearbudget"
# Single source of truth: the version is read from the VERSION file at build
# time (the runtime reads the same file via clear_budget.version). Never
# hardcode a version here.
dynamic = ["version"]
description = "Personal monthly budget planner with credit card tracking"
authors = [{name = "Oliver Ernster", email = "oernster@codecrafter.uk"}]
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
# Kept in step with [tool.black] so the two never disagree on wrapping.
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The installer runs unattended against a live Windows machine, where a
# best-effort step (COM teardown in a finally block, removing a shortcut that
# is already gone, deleting a temp dir still held by Explorer) must never abort
# a half-finished install.  Those handlers are broad and silent on purpose;
# the failures that do matter are raised as InstallerOperationError.
"installer/**/*.py" = ["BLE001", "S110", "S112"]
# Tests build fixtures relative to the local calendar date, because that is the
# semantics the code under test has: a budget month is the user's calendar
# month, so a timezone-aware clock here would not match the application.
"tests/**/*.py" = ["DTZ005", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The hard gate covers the application package and the Qt-free half of the
# setup program. The installer does the most privileged work in this repository
# (registry writes, shortcut creation, per-user deployment, process control and
# uninstall), so its operations and its state model are gated rather than left
# unmeasured. installer/app.py and installer/ui are the Qt client and are
# excluded in .coveragerc on the same grounds as clear_budget/ui.
addopts = "-q --cov=clear_budget --cov=main --cov=installer --cov-report=term-missing --cov-fail-under=100 --cov-config=.coveragerc"
pythonpath = ["."]

[tool.coverage.run]
source = ["clear_budget", "main", "installer"]
branch = true
